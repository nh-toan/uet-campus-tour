<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <title>Equirectangular panorama orientation test grid</title>
  <desc>Four directional zones with zenith, nadir, horizon, and seam markers.</desc>

  <defs>
    <pattern id="minor-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
    </pattern>
    <pattern id="major-grid" width="400" height="200" patternUnits="userSpaceOnUse">
      <rect width="400" height="200" fill="url(#minor-grid)" />
      <path d="M 400 0 L 0 0 0 200" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" />
    </pattern>
    <style>
      .direction {
        fill: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 92px;
        font-weight: 800;
        letter-spacing: 8px;
        paint-order: stroke;
        stroke: #111827;
        stroke-width: 12px;
        text-anchor: middle;
      }

      .label {
        fill: #ffffff;
        font-family: ui-monospace, monospace;
        font-size: 28px;
        font-weight: 700;
        paint-order: stroke;
        stroke: #111827;
        stroke-width: 7px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="400" height="800" x="0" fill="#1d4ed8" />
  <rect width="400" height="800" x="400" fill="#047857" />
  <rect width="400" height="800" x="800" fill="#c2410c" />
  <rect width="400" height="800" x="1200" fill="#7e22ce" />
  <rect width="1600" height="800" fill="url(#major-grid)" />

  <path d="M 0 400 H 1600" stroke="#ffffff" stroke-width="8" stroke-dasharray="24 16" />
  <text class="label" x="800" y="385">HORIZON / 0° PITCH</text>

  <text class="direction" x="200" y="500">NORTH</text>
  <text class="direction" x="600" y="500">EAST</text>
  <text class="direction" x="1000" y="500">SOUTH</text>
  <text class="direction" x="1400" y="500">WEST</text>

  <text class="label" x="200" y="555">0° YAW</text>
  <text class="label" x="600" y="555">+90° YAW</text>
  <text class="label" x="1000" y="555">180° YAW</text>
  <text class="label" x="1400" y="555">-90° YAW</text>

  <circle cx="800" cy="72" r="48" fill="#111827" stroke="#ffffff" stroke-width="6" />
  <path d="M 800 30 L 780 75 H 793 V 112 H 807 V 75 H 820 Z" fill="#ffffff" />
  <text class="label" x="800" y="155">ZENITH / +90° PITCH</text>

  <circle cx="800" cy="728" r="48" fill="#111827" stroke="#ffffff" stroke-width="6" />
  <path d="M 800 770 L 780 725 H 793 V 688 H 807 V 725 H 820 Z" fill="#ffffff" />
  <text class="label" x="800" y="655">NADIR / -90° PITCH</text>

  <path d="M 8 0 V 800 M 1592 0 V 800" stroke="#facc15" stroke-width="16" stroke-dasharray="28 16" />
  <text class="label" x="70" y="70" text-anchor="start">SEAM A</text>
  <text class="label" x="1530" y="70" text-anchor="end">SEAM B</text>
</svg>
